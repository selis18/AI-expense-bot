name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: expenses
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: expenses
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expenses -d expenses"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://expenses:test-only@localhost:5432/expenses?sslmode=disable
      DATABASE_URL: postgres://expenses:test-only@localhost:5432/expenses?sslmode=disable
      BOT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build -o bin/expense-bot ./cmd/expense-bot
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: |
          bin/expense-bot > /tmp/expense-bot.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/readyz; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/readyz
          psql "$DATABASE_URL" -c "INSERT INTO users(id,display_name) VALUES (900001,'Test user')"
      - run: pnpm test
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: web/test-results
  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: test-only
      BOT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait --wait-timeout 180
      - run: |
          curl -fsS http://localhost:8080/readyz
          curl -fsS http://localhost:8080/ | grep 'root'
          docker compose exec -T postgres psql -U expenses -d expenses -c "INSERT INTO users(id,display_name) VALUES (900001,'Test user')"
          curl -fsS -H 'Content-Type: application/json' -d '{"user_id":900001,"amount":"350.50","category":"еда","spent_at":"2026-10-21"}' http://localhost:8080/api/expenses
          docker compose restart
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/readyz; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/api/expenses | grep '350.50'
      - run: docker compose logs
        if: failure()
      - run: docker compose down -v
        if: always()
